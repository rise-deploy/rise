# =============================================================================
# Reference standalone Docker Compose deployment of Rise (Rise + Postgres + Dex +
# registry + Traefik) using the Docker deployment backend.
#
#   docker compose -f docker-compose.standalone.yaml up -d
#
# This file is fully self-contained — it does NOT layer on top of the dev
# docker-compose.yml. It brings up everything Rise needs to deploy apps through
# the `docker` deployment controller: Postgres for state, Dex as the OIDC
# provider, an OCI registry for app images, Traefik as the ingress reverse
# proxy, and the Rise backend itself. App containers stamped by the Docker
# controller join the `rise_default` network (see `traefik_network` in
# config/compose-docker.production.yaml); Traefik is pinned to that same
# network so it can route `*.rise.localhost` to them.
#
# -----------------------------------------------------------------------------
# PRODUCTION-CAPABLE STARTING POINT — NOT PRODUCTION-READY AS-IS.
#
# Treat this like a Helm `values.yaml`: a sound, working base that you are
# expected to harden before exposing it to anyone. Before any real use:
#
#   * REGENERATE ALL SECRETS/KEYS. The demo jwt_signing_secret, encryption key,
#     OAuth client_secret (config/compose-docker.production.yaml) and the
#     Postgres password below are INSECURE PLACEHOLDERS. Replace every one.
#   * SET REAL DOMAINS + TLS. Replace `rise.localhost` with your domain, point
#     Traefik at an ACME/cert resolver (e.g. add a `websecure` entrypoint on
#     :443 and `--certificatesresolvers.<name>...`), set the controller's
#     `traefik_certresolver`, and flip `cookie_secure: true` + `ingress_schema:
#     https` in the production config.
#   * PIN A REAL IMAGE TAG. Set RISE_IMAGE_TAG to a released version (see the
#     `rise` service default below); do not float on `latest` in production.
#   * REVIEW RESOURCE LIMITS. Add `deploy.resources` / ulimits per service to
#     fit your host; none are set here.
#   * PERSIST + BACK UP VOLUMES. The named volumes below are local; use durable
#     storage and a backup strategy for `postgres_data` and `registry_data`.
#   * DO NOT EXPOSE THE DEBUG DASHBOARD. The Traefik API/dashboard and DEBUG
#     logging are OFF by default here and gated behind the `debug` profile —
#     never enable that profile on a reachable network.
#   * LOCK DOWN EXPOSED PORTS. Postgres (5432), the registry (5000) and Dex
#     (5556) are published to the host for convenience; bind them to localhost
#     or drop the host port mappings in production.
#
# Image tag is overridable for CI via RISE_IMAGE_REPOSITORY / RISE_IMAGE_TAG.
# =============================================================================

# Fixed project name so the network is always "rise_default", regardless of the
# directory the stack is launched from. The Docker controller attaches app
# containers to this network and Traefik is pinned to it.
name: rise

networks:
  default:
    name: rise_default

volumes:
  postgres_data:
  registry_data:
  dex_data:

services:
  postgres:
    image: postgres:18-trixie
    container_name: rise-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rise}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rise123}
      - POSTGRES_DB=${POSTGRES_DB:-rise}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rise"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OIDC provider. Serves the Docker-flavoured config (issuer http://dex:5556/dex)
  # with staticPasswords admin@example.com/"password" and the rise-backend client.
  dex:
    image: dexidp/dex:v2.45.1
    container_name: rise-dex
    restart: unless-stopped
    user: "0:0"
    ports:
      - "5556:5556"
    volumes:
      - ./dev/dex/config.docker.yaml:/etc/dex/config.docker.yaml:ro
      - dex_data:/var/dex
    entrypoint: ["/usr/local/bin/dex"]
    command: ["serve", "/etc/dex/config.docker.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5556/dex/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OCI registry for images pushed by the rise CLI.
  registry:
    image: registry:3
    container_name: rise-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true

  # Traefik reverse proxy for the Docker deployment controller (type: docker).
  # Routes *.rise.localhost to app containers via the Docker provider, reading
  # the Traefik labels the Rise controller stamps on each app container.
  #
  # Must be v3.7.1: the host Docker daemon (29.x, API 1.54) requires a Traefik
  # build new enough to negotiate that API version. Older v3.x ship a Docker
  # client that pins client version 1.24, which the daemon rejects ("client
  # version 1.24 is too old"), and Traefik then 404s every route. v3.7.1
  # negotiates the API directly over the raw socket — no socket-proxy/relay.
  traefik:
    image: traefik:v3.7.1
    container_name: rise-traefik
    restart: unless-stopped
    command:
      # Default to INFO and NO insecure API/dashboard for the reference. The
      # insecure dashboard + DEBUG logging live in the optional `traefik-debug`
      # service below (profile: ["debug"]) — opt in only on a trusted host.
      #
      # NOTE for debugging: DEBUG surfaces the provider-negotiation line
      # ("Provider connection established with docker <version> (API <ver>)"),
      # which confirms Traefik negotiated the host Docker API version. The
      # symptom of a too-old Traefik is "client version 1.24 is too old"; if you
      # see that, the v3.7.1 pin above has regressed.
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=rise_default"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"        # app traffic: http://<project>.rise.localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  # OPTIONAL debug Traefik (opt-in): same image/socket, but with DEBUG logging
  # and the insecure API/dashboard on :8090. Enable ONLY on a trusted host:
  #
  #   docker compose -f docker-compose.standalone.yaml --profile debug up -d traefik-debug
  #
  # Run it INSTEAD OF the default `traefik` (it binds the same :80), e.g. stop
  # `traefik` first, or scale it to 0. Never expose :8090 on a reachable net.
  traefik-debug:
    image: traefik:v3.7.1
    container_name: rise-traefik-debug
    restart: unless-stopped
    profiles: ["debug"]
    command:
      - "--log.level=DEBUG"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=rise_default"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"        # app traffic: http://<project>.rise.localhost
      - "8090:8080"    # Traefik dashboard: http://localhost:8090 (INSECURE)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  # Rise backend. Migrations auto-run on startup. Uses the Docker deployment
  # controller (config/compose-docker.production.yaml), mounting the host Docker
  # socket so it can create/route app containers.
  rise:
    # Defaults to the latest released tag; override with RISE_IMAGE_TAG (CI/e2e
    # does this) or RISE_IMAGE_REPOSITORY for a fork/mirror. Pin a specific tag
    # in production — do not float on `latest`.
    image: ${RISE_IMAGE_REPOSITORY:-ghcr.io/rise-deploy/rise}:${RISE_IMAGE_TAG:-0.22.1}
    container_name: rise-backend
    restart: unless-stopped
    command: ["backend", "server"]
    ports:
      - "3000:3000"
    # The rise-backend is on `rise_default` already; these labels publish a
    # high-priority Traefik router that catches PathPrefix(`/.rise`) on EVERY
    # host and routes it to this backend on :3000. This mirrors the Kubernetes
    # `/.rise -> rise-backend` Ingress path (see ResourceBuilder in
    # src/server/deployment/resource_builder.rs) and is REQUIRED for private
    # (forwardAuth) access classes to work: it lets the same-host
    # /.rise/auth/signin page be served by the backend on the APP host, so the
    # login cookie lands on the host forwardAuth reads — and it closes the
    # auth-bypass where an app could otherwise shadow /.rise.
    #
    # priority=1000 must EXCEED the app routers' default (rule-length) priority
    # so /.rise on an app host wins over the app's Host(...) router.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rise-dotrise.rule=PathPrefix(`/.rise`)"
      - "traefik.http.routers.rise-dotrise.entrypoints=web"
      - "traefik.http.routers.rise-dotrise.priority=1000"
      - "traefik.http.routers.rise-dotrise.service=rise-dotrise"
      - "traefik.http.services.rise-dotrise.loadbalancer.server.port=3000"
      - "traefik.docker.network=rise_default"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-rise}:${POSTGRES_PASSWORD:-rise123}@rise-postgres:5432/${POSTGRES_DB:-rise}
      - RISE_CONFIG_DIR=/etc/rise-docker
      - RISE_CONFIG_RUN_MODE=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/compose-docker.production.yaml:/etc/rise-docker/production.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_started
      registry:
        condition: service_started
      traefik:
        condition: service_started
    networks:
      - default
