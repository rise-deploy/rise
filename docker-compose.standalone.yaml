# =============================================================================
# Reference standalone Docker Compose deployment of Rise (Rise + Postgres + Dex +
# registry + Traefik) using the Docker deployment backend.
#
#   # Production-shaped (TLS via Let's Encrypt):
#   export RISE_DOMAIN=rise.example.com ACME_EMAIL=ops@example.com
#   docker compose -f docker-compose.standalone.yaml up -d
#
#   # Local / e2e (plain HTTP on rise.localhost, no ACME) — layer the overlay:
#   docker compose -f docker-compose.standalone.yaml \
#                  -f docker-compose.standalone.local.yaml up -d
#
# This file is fully self-contained — it does NOT layer on top of the dev
# docker-compose.yml. It brings up everything Rise needs to deploy apps through
# the `docker` deployment controller: Postgres for state, Dex as the OIDC
# provider, an OCI registry for app images, Traefik as the ingress reverse
# proxy, and the Rise backend itself. App containers stamped by the Docker
# controller join the `rise_default` network (see `traefik_network` in
# config/compose-docker.production.yaml); Traefik is pinned to that same
# network so it can route `{project}.${RISE_DOMAIN}` to them.
#
# -----------------------------------------------------------------------------
# PRODUCTION-CAPABLE STARTING POINT — NOT PRODUCTION-READY AS-IS.
#
# Treat this like a Helm `values.yaml`: a sound, working base that you are
# expected to harden before exposing it to anyone. Before any real use:
#
#   * REGENERATE ALL SECRETS/KEYS. The demo jwt_signing_secret, encryption key,
#     OAuth client_secret (config/compose-docker.production.yaml) and the
#     Postgres password below are INSECURE PLACEHOLDERS. Replace every one.
#   * SET RISE_DOMAIN + ACME_EMAIL. TLS is on by default via the `le` ACME
#     resolver (HTTP-01). Use the LE STAGING directory while testing (set
#     ACME_CA_SERVER, see the traefik service) to avoid rate limits, then drop
#     it for real certs. The Dex client secret must stay in sync with
#     dev/dex/config.yaml.
#   * REGISTRY AUTH. The registry is exposed at registry.${RISE_DOMAIN} behind
#     a Traefik basicauth middleware (htpasswd via REGISTRY_BASIC_AUTH). The CLI
#     does its own `docker login` against that URL (oci-client-auth mints no
#     creds). See the operator docs for the full login/push flow.
#   * PIN A REAL IMAGE TAG. RISE_IMAGE_TAG below is a manual pin; bump it on
#     upgrade (there is no automatic 'latest released' resolution).
#   * REVIEW RESOURCE LIMITS. Add `deploy.resources` / ulimits per service to
#     fit your host; none are set here.
#   * PERSIST + BACK UP VOLUMES. The named volumes below are local; use durable
#     storage and a backup strategy for `postgres_data`, `registry_data` and
#     `traefik_acme`.
#   * LOCK DOWN EXPOSED PORTS. Postgres (5432) and the registry (5000) are
#     published to the host for convenience; bind them to localhost or drop the
#     host port mappings in production (the registry is reachable via Traefik).
#
# Image tag is overridable for CI via RISE_IMAGE_REPOSITORY / RISE_IMAGE_TAG.
# =============================================================================

# Fixed project name so the network is always "rise_default", regardless of the
# directory the stack is launched from. The Docker controller attaches app
# containers to this network and Traefik is pinned to it.
name: rise

networks:
  default:
    name: rise_default

volumes:
  postgres_data:
  registry_data:
  dex_data:
  traefik_acme:

services:
  postgres:
    image: postgres:18-trixie
    container_name: rise-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rise}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rise123}
      - POSTGRES_DB=${POSTGRES_DB:-rise}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rise"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OIDC provider. Serves dev/dex/config.yaml (issuer http://rise-dex:5556/dex)
  # with staticPasswords admin@example.com/"password" and the rise-backend client.
  # The issuer host `rise-dex` is the single issuer used everywhere (host dev
  # backend, containerized backend, and the prod dex.${RISE_DOMAIN} router).
  dex:
    image: dexidp/dex:v2.45.1
    container_name: rise-dex
    restart: unless-stopped
    user: "0:0"
    ports:
      - "5556:5556"
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
      - dex_data:/var/dex
    entrypoint: ["/usr/local/bin/dex"]
    command: ["serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5556/dex/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        # container_name is already rise-dex, but pin an explicit alias so the
        # containerized backend resolves `rise-dex` on rise_default regardless.
        aliases:
          - rise-dex
    # Expose Dex publicly at dex.${RISE_DOMAIN} (TLS) so browsers can reach the
    # OIDC issuer when DEX_ISSUER points there. The local overlay drops these.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rise-dex.rule=Host(`dex.${RISE_DOMAIN}`)"
      - "traefik.http.routers.rise-dex.entrypoints=websecure"
      - "traefik.http.routers.rise-dex.tls=true"
      - "traefik.http.routers.rise-dex.tls.certresolver=le"
      - "traefik.http.services.rise-dex.loadbalancer.server.port=5556"
      - "traefik.docker.network=rise_default"

  # OCI registry for images pushed by the rise CLI. Exposed publicly via Traefik
  # at registry.${RISE_DOMAIN} behind a basicauth middleware (the CLI does its
  # own `docker login`; oci-client-auth mints no credentials). The :5000 host
  # port stays for internal/debug convenience — bind it to localhost in prod.
  registry:
    image: registry:3
    container_name: rise-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rise-registry.rule=Host(`registry.${RISE_DOMAIN}`)"
      - "traefik.http.routers.rise-registry.entrypoints=websecure"
      - "traefik.http.routers.rise-registry.tls=true"
      - "traefik.http.routers.rise-registry.tls.certresolver=le"
      - "traefik.http.routers.rise-registry.middlewares=rise-registry-auth"
      # htpasswd-format users; generate with `htpasswd -nbB user pass` and pass
      # via REGISTRY_BASIC_AUTH (escape $ as $$ in a .env file). See operator docs.
      - "traefik.http.middlewares.rise-registry-auth.basicauth.users=${REGISTRY_BASIC_AUTH:-}"
      - "traefik.http.services.rise-registry.loadbalancer.server.port=5000"
      - "traefik.docker.network=rise_default"

  # Traefik reverse proxy for the Docker deployment controller (type: docker).
  # Routes {project}.${RISE_DOMAIN} to app containers via the Docker provider,
  # reading the Traefik labels the Rise controller stamps on each app container.
  #
  # TLS: the `le` ACME resolver requests certs via the HTTP-01 challenge on the
  # `web` entrypoint; all plain HTTP is redirected to HTTPS. The local overlay
  # (docker-compose.standalone.local.yaml) overrides the command to a single
  # `web` (:80) entrypoint with no ACME/redirect for HTTP-only local/e2e use.
  #
  # Must be v3.7.1: the host Docker daemon (29.x, API 1.54) requires a Traefik
  # build new enough to negotiate that API version. Older v3.x ship a Docker
  # client that pins client version 1.24, which the daemon rejects ("client
  # version 1.24 is too old"), and Traefik then 404s every route. v3.7.1
  # negotiates the API directly over the raw socket — no socket-proxy/relay.
  traefik:
    image: traefik:v3.7.1
    container_name: rise-traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=rise_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP -> HTTPS redirect.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # ACME (Let's Encrypt) HTTP-01 challenge on the `web` entrypoint.
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # Override to the LE STAGING directory while testing to dodge rate limits:
      #   ACME_CA_SERVER=https://acme-staging-v02.api.letsencrypt.org/directory
      - "--certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
    ports:
      - "80:80"        # HTTP (ACME challenge + redirect to HTTPS)
      - "443:443"      # HTTPS: https://{project}.${RISE_DOMAIN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme
    networks:
      - default

  # Rise backend. Migrations auto-run on startup. Uses the Docker deployment
  # controller (config/compose-docker.production.yaml), mounting the host Docker
  # socket so it can create/route app containers.
  rise:
    # RISE_IMAGE_TAG is MANUALLY PINNED to a known-good released version; bump on
    # upgrade — there is no automatic 'latest released' resolution. Override with
    # RISE_IMAGE_TAG (CI/e2e does this) or RISE_IMAGE_REPOSITORY for a fork/mirror.
    image: ${RISE_IMAGE_REPOSITORY:-ghcr.io/rise-deploy/rise}:${RISE_IMAGE_TAG:-0.22.0}
    container_name: rise-backend
    restart: unless-stopped
    command: ["backend", "server"]
    ports:
      - "3000:3000"
    # Route /.rise/* to the Rise backend (login + ingress-auth), like the K8s
    # /.rise Ingress path. priority=1000 must exceed the app routers' default
    # (rule-length) priority so /.rise on an app host wins over the app router.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rise-dotrise.rule=PathPrefix(`/.rise`)"
      - "traefik.http.routers.rise-dotrise.entrypoints=websecure"
      - "traefik.http.routers.rise-dotrise.tls=true"
      - "traefik.http.routers.rise-dotrise.tls.certresolver=le"
      - "traefik.http.routers.rise-dotrise.priority=1000"
      - "traefik.http.routers.rise-dotrise.service=rise-dotrise"
      - "traefik.http.services.rise-dotrise.loadbalancer.server.port=3000"
      - "traefik.docker.network=rise_default"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-rise}:${POSTGRES_PASSWORD:-rise123}@rise-postgres:5432/${POSTGRES_DB:-rise}
      - RISE_CONFIG_DIR=/etc/rise-docker
      - RISE_CONFIG_RUN_MODE=production
      - RISE_DOMAIN=${RISE_DOMAIN}
      # Single OIDC issuer. Defaults to the public Dex router; override to point
      # at Dex fronted elsewhere. Computed here (not in the config) so the value
      # is fully resolved before the backend reads it.
      - DEX_ISSUER=${DEX_ISSUER:-https://dex.${RISE_DOMAIN}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/compose-docker.production.yaml:/etc/rise-docker/production.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      dex:
        condition: service_started
      registry:
        condition: service_started
      traefik:
        condition: service_started
    networks:
      - default
