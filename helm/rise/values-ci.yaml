# CI-specific Helm values for Minikube e2e tests
# Used by scripts/ci/e2e-minikube.sh

postgresql:
  enabled: true

dex:
  enabled: true
  config:
    issuer: http://rise-ci-chart-dex.rise-ci.svc.cluster.local:5556/dex
    # Override the chart's default rise-backend client to add grantTypes. Setting
    # grantTypes REPLACES — not extends — Dex's default set, so we list the full
    # default set (authorization_code, refresh_token, device_code, token-exchange)
    # plus `password`. The resource-owner password grant is CI-only: it lets the
    # rise-e2e harness mint OIDC id_tokens non-interactively for the static users
    # (enablePasswordDB / staticPasswords / oauth2.passwordConnector come from the
    # chart defaults and are deep-merged in). Mirrors dev/dex/config.yaml. Helm
    # replaces list values, so the whole client must be reproduced here.
    staticClients:
      - id: rise-backend
        redirectURIs:
          - "http://rise.example.com/"
          - "http://rise.example.com/api/v1/auth/callback"
          - "http://localhost:8765/callback"
          - "http://localhost:8766/callback"
          - "http://localhost:8767/callback"
        name: "Rise Backend"
        secret: "rise-backend-secret"
        grantTypes:
          - authorization_code
          - refresh_token
          - "urn:ietf:params:oauth:grant-type:device_code"
          - "urn:ietf:params:oauth:grant-type:token-exchange"
          - password

logs:
  backend: loki
  loki:
    enabled: true
  alloy:
    enabled: true

ingress:
  enabled: false

config:
  server:
    public_url: http://rise.local
    jwt_signing_secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItY2ktdGVzdGluZy1vbmx5LW5vdC1zZWN1cmU=

  auth:
    issuer: http://rise-ci-chart-dex.rise-ci.svc.cluster.local:5556/dex
    client_id: rise-backend
    client_secret: rise-backend-secret

  encryption:
    type: aes-gcm-256
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  registry:
    type: oci-client-auth
    registry_url: localhost:5000
    namespace: rise-apps
    client_registry_url: http://localhost:5000

  deployment_controller:
    type: kubernetes
    # Short identity-token TTL so the e2e workload-identity refresh assertion
    # (scripts/ci/lib/identity.sh) observes an in-place re-mint (at half-TTL)
    # inside the test window. CI-only; production keeps the 3600s default.
    identity_token_ttl_seconds: 60
    production_ingress_url_template: "{project_name}.apps.rise.local"
    staging_ingress_url_template: "{project_name}-{deployment_group}.preview.rise.local"
    environment_ingress_url_template: "{project_name}-{environment}.preview.rise.local"
    ingress_schema: http
    access_classes:
      public:
        display_name: Public
        description: Public access without authentication
        ingress_class: nginx
        access_requirement: None
