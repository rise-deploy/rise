# Default values for rise
replicaCount: 1

image:
  repository: ghcr.io/rise-deploy/rise
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the image tag whose default is the chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # IAM role ARN for IRSA (IAM Roles for Service Accounts) on EKS
  # When set, adds eks.amazonaws.com/role-arn annotation to the ServiceAccount
  # Example: "arn:aws:iam::123456789012:role/rise-backend"
  iamRoleArn: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# Additional environment variables (key-value pairs)
env: []
  # - name: RUST_LOG
  #   value: "info"
  # - name: AWS_REGION
  #   value: "us-east-1"

# Environment variables from ConfigMaps and Secrets
envFrom: []
  # - secretRef:
  #     name: rise-env-secrets
  # - configMapRef:
  #     name: rise-env-config

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: rise.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: rise-tls
  #    hosts:
  #      - rise.example.com

# Server container resources
server:
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Network policy for the server pods.
# Only created when metacontroller is enabled (the policy also covers the webhook port).
networkPolicy:
  # Restrict which pods can reach the main HTTP port.
  # By default no "from" selector is set, allowing any pod in the cluster.
  # Set this to a list of NetworkPolicy peer entries to restrict access.
  httpIngressFrom: []
  # Example: only allow the ingress-nginx controller
  # httpIngressFrom:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: ingress-nginx
  #     namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx

# Metacontroller integration
# See: https://metacontroller.github.io/metacontroller/
metacontroller:
  enabled: true
  # Resync interval in seconds (default: 5)
  resyncPeriodSeconds: 5
  # Override the webhook base URL (defaults to the internal webhook service URL)
  # webhookBaseUrl: "http://rise-webhook.rise-system.svc:3001"
  # Port for the internal webhook listener (default: 3001)
  # webhookPort: 3001
  # Webhook authentication uses Kubernetes pod-IP validation (two layers: NetworkPolicy +
  # source-IP check). No shared secret is required. When metacontroller.enabled=true,
  # RISE_METACONTROLLER_POD_NAMESPACE is automatically injected into the Rise config.
  # Namespace where an external metacontroller operator runs (for NetworkPolicy).
  # Only used when install=false. When install=true, the release namespace is used.
  # namespace: "metacontroller"
  # Install the Metacontroller operator itself as a subchart dependency.
  # Disable this if Metacontroller is already installed in the cluster.
  install: true

# Runtime deployment logs.
# The Rise API always enforces authorization and proxies log access; Loki is only
# contacted by the backend and by Alloy.
logs:
  # kubernetes: stream directly from active Pods only.
  # loki: query historical logs from Loki.
  backend: kubernetes
  loki:
    # Installs the Grafana Loki subchart when true. Set false with externalUrl
    # to connect Rise to an operator-managed Loki.
    enabled: false
    externalUrl: ""
    tenantId: ""
    timeoutSeconds: 10
    # Display-only hint used by Rise when no logs are found. Retention is still
    # enforced by Loki itself.
    retentionHint: ""
    bearerTokenSecret:
      name: ""
      key: token
  alloy:
    # Installs the Grafana Alloy subchart when true. Alloy ships pod logs to
    # Loki and preserves Rise deployment labels for historical lookup.
    enabled: false

# Grafana Loki subchart values. These defaults are intentionally small and
# PVC-backed for simple installs; production operators should tune or provide
# their own Loki.
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: rise_loki_index_
            period: 24h
    limits_config:
      retention_period: 168h
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

# Grafana Alloy subchart values. The configMap name is fixed so this chart can
# provide templated Alloy configuration while still using the upstream subchart.
alloy:
  alloy:
    configMap:
      create: false
      name: rise-alloy-config
      key: config.alloy

# Rise backend configuration overrides
# Converted to YAML and mounted as /etc/rise/local.yaml
# The backend supports both TOML and YAML - this chart outputs YAML by default
config:
  server:
    host: "0.0.0.0"
    port: 3000
    public_url: "http://rise.example.com"
    # cookie_secure: true  # Optional: Set Secure flag on cookies (default: true, set false for HTTP development)

  auth:
    issuer: "http://dex:5556/dex"
    client_id: "rise-backend"
    client_secret: ""  # Override with Secret or environment variable
    # admin_users: []  # Optional: List of admin user emails with full permissions
    # Optional: Custom OAuth2 endpoints (autodiscovered from issuer/.well-known/openid-configuration if not set)
    # For Entra ID/Azure AD:
    # authorize_url: "https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/authorize"
    # token_url: "https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token"

  database: {}
    # url is typically set via DATABASE_URL environment variable from a Secret
    # url: "postgres://user:pass@host:5432/dbname"

  # Optional: Controller timing configuration
  # controller:
  #   reconcile_interval_secs: 5
  #   health_check_interval_secs: 5
  #   termination_interval_secs: 5
  #   cancellation_interval_secs: 5
  #   expiration_interval_secs: 60
  #   secret_refresh_interval_secs: 3600

  # Container registry configuration (required)
  registry:
    type: "oci-client-auth"
    registry_url: "registry.example.com"
    namespace: "rise-apps"
    # Alternative: AWS ECR registry
    # type: "ecr"
    # region: "us-east-1"
    # account_id: "123456789012"
    # repo_prefix: "rise/"
    # role_arn: "arn:aws:iam::123456789012:role/rise-backend"
    # push_role_arn: "arn:aws:iam::123456789012:role/rise-backend-ecr-push"
    # auto_remove: false

  # Optional: Kubernetes deployment controller configuration
  # IMPORTANT: namespace_format should use a consistent prefix for security.
  # Metacontroller manages namespaces (and other child resources) on Rise's behalf.
  # Use a consistent prefix (e.g., "rise-") and enforce it with admission controllers or policies.
  # kubernetes:
  #   kubeconfig: ""  # Optional: Path to kubeconfig (defaults to in-cluster config)
  #   ingress_class: "nginx"
  #   production_ingress_url_template: "{project_name}.apps.rise.dev"  # Must contain {project_name}
  #   staging_ingress_url_template: "{project_name}-{deployment_group}.preview.rise.dev"  # Optional, must contain {project_name} and {deployment_group}
  #   # Or for sub-path routing:
  #   # production_ingress_url_template: "rise.dev/{project_name}"
  #   # staging_ingress_url_template: "rise.dev/{project_name}/{deployment_group}"
  #   auth_backend_url: "http://rise-backend.default.svc.cluster.local:3000"  # Internal cluster URL for Nginx auth
  #   auth_signin_url: "https://rise.dev"  # Public URL for browser redirects
  #   namespace_format: "rise-{project_name}"  # Must use consistent prefix and contain {project_name}
  #   namespace_labels: {}  # Optional: Labels for managed namespaces
  #   namespace_annotations: {}  # Optional: Annotations for managed namespaces
  #   ingress_annotations: {}  # Optional: Additional annotations (e.g., cert-manager)
  #   ingress_tls_secret_name: ""  # Optional: TLS secret name for ingresses

# PostgreSQL (optional, can use external database)
# When enabled, DATABASE_URL is automatically injected into all containers
postgresql:
  enabled: false

  image:
    repository: postgres
    tag: "18-trixie"
    pullPolicy: IfNotPresent

  auth:
    username: rise
    password: rise123  # CHANGE IN PRODUCTION: Override via Secret
    database: rise

  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""  # Use cluster default

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Major version upgrade support using pgautoupgrade
  # Enable this temporarily when upgrading PostgreSQL major versions (e.g., 16 -> 18).
  # See docs/upgrading-postgresql.md for the full procedure.
  # IMPORTANT: The pgautoupgrade image tag must match the TARGET PostgreSQL major version
  # (i.e., the same major version as postgresql.image.tag above).
  # NOTE: Use Debian-based tags (e.g., "18-trixie") for both the main and upgrade images.
  # Alpine postgres images use UID 70, which doesn't match our pod's runAsUser (999).
  # pgautoupgrade tries gosu when UIDs don't match, which fails without root.
  upgrade:
    enabled: false
    image:
      repository: pgautoupgrade/pgautoupgrade
      tag: "18-trixie"
      pullPolicy: IfNotPresent

# Dex OIDC provider (optional)
dex:
  enabled: false
  replicaCount: 1

  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.45.1
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  service:
    type: ClusterIP
    port: 5556
    grpcPort: 5557

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Dex configuration
  # Converted to YAML and mounted as /etc/dex/config.yaml
  # See https://dexidp.io/docs/ for full configuration options
  config:
    issuer: "http://dex:5556/dex"

    storage:
      type: memory

    web:
      http: "0.0.0.0:5556"

    staticClients:
      - id: rise-backend
        redirectURIs:
          # Frontend JavaScript OAuth flow (update based on your actual public_url)
          - "http://rise.example.com/"
          # Backend OAuth2 Proxy flow for ingress auth
          - "http://rise.example.com/api/v1/auth/callback"
          # CLI callback URLs
          - "http://localhost:8765/callback"
          - "http://localhost:8766/callback"
          - "http://localhost:8767/callback"
        name: "Rise Backend"
        secret: "rise-backend-secret"

    enablePasswordDB: true
    staticPasswords:
      - email: "admin@example.com"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
        username: "admin"
        userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
      - email: "dev@example.com"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
        username: "dev"
        userID: "f4d1c5e1-3c6e-4d2a-9f4b-2e5d7c8e9f01"
      - email: "user@example.com"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"  # password
        username: "user"
        userID: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"

    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
