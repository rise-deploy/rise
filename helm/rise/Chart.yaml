apiVersion: v2
name: chart
description: A Helm chart for Rise - a Kubernetes deployment platform
type: application
version: 0.23.0-rc20
appVersion: "0.23.0-rc20"
kubeVersion: ">=1.32.0-0"
keywords:
  - kubernetes
  - deployment
  - paas
home: https://github.com/rise-deploy/rise
sources:
  - https://github.com/rise-deploy/rise
annotations:
  # The chart deploys the Kubernetes backend and is licensed with it.
  artifacthub.io/license: BUSL-1.1
dependencies:
  - name: metacontroller-helm
    version: "4.17.6"
    repository: "oci://ghcr.io/metacontroller"
    alias: metacontroller-operator
    condition: metacontroller.install
  - name: loki
    version: "7.3.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: logs.loki.enabled
  - name: alloy
    version: "1.14.3"
    repository: "https://grafana.github.io/helm-charts"
    condition: logs.alloy.enabled
