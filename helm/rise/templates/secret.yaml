# This template is intentionally empty: the chart creates no Secret.
#
# The backend reads these from the environment:
#   - DATABASE_URL: PostgreSQL connection string (injected by the chart when
#     postgresql.enabled is true)
#   - OIDC_CLIENT_SECRET: OAuth client secret
#   - RISE_JWT_SIGNING_SECRET: session signing key (openssl rand -base64 32)
#
# Example:
# kubectl create secret generic rise-secrets \
#   --from-literal=OIDC_CLIENT_SECRET=YOUR_CLIENT_SECRET \
#   --from-literal=DATABASE_URL=postgres://rise:password@postgresql:5432/rise \
#   --from-literal=RISE_JWT_SIGNING_SECRET=$(openssl rand -base64 32)
#
# Then reference them in values.yaml:
# envFrom:
#   - secretRef:
#       name: rise-secrets
