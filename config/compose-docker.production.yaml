# =============================================================================
# INSECURE DEMO VALUES — REGENERATE BEFORE ANY REAL USE.
#
# This file is the reference production config for the standalone Docker Compose
# stack (TLS / Let's Encrypt variant). The jwt_signing_secret, encryption.key
# and auth.client_secret below are well-known placeholders shared in the repo
# and provide NO security. Before exposing this to anyone:
#   * jwt_signing_secret  — replace with 32 random bytes, base64-encoded
#                           (e.g. `openssl rand -base64 32`).
#   * encryption.key      — replace with a fresh AES-256 key (same generation).
#   * auth.client_secret  — replace and keep it in sync with the Dex client
#                           secret in dev/dex/config.yaml.
#   * Postgres password   — set POSTGRES_PASSWORD in the compose env.
#
# Domains come from the RISE_DOMAIN env var (control plane at rise.${RISE_DOMAIN},
# apps at {project}.${RISE_DOMAIN}, registry at registry.${RISE_DOMAIN}, Dex at
# dex.${RISE_DOMAIN}). The config loader interpolates ${VAR} but leaves Rise's
# own {project_name} ingress placeholders intact. Do NOT rename this file —
# docker-compose.standalone.yaml mounts it by name.
# =============================================================================
server:
  host: "0.0.0.0"
  port: 3000
  # Base public URL of the control plane. App hosts ({project}.${RISE_DOMAIN})
  # are subdomains of this host so the post-login same-host redirect validates
  # (see validate_redirect_url in src/server/auth/handlers.rs).
  public_url: "https://rise.${RISE_DOMAIN}"
  cookie_secure: true
  jwt_signing_secret: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  jwt_claims: ["sub", "email", "name"]
  static_dir: "${RISE_STATIC_DIR:-/var/lib/rise/static}"
  docs_dir: "${RISE_DOCS_DIR:-/var/rise/docs}"
  ssrf:
    allow_private_networks: true
    allow_http: true
database:
  url: "${DATABASE_URL}"
encryption:
  type: "aes-gcm-256"
  key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
auth:
  # Single issuer. DEX_ISSUER is set by the compose layer (defaults to the
  # public Dex router https://dex.${RISE_DOMAIN}); override the env to point at
  # Dex fronted elsewhere. Computed in compose because the config loader does a
  # single, non-recursive ${VAR} pass and cannot expand a nested default.
  issuer: "${DEX_ISSUER}"
  client_id: "rise-backend"
  client_secret: "rise-backend-secret"
  admin_users: ["admin@example.com"]
  operator_users: ["ops@example.com"]
  allow_team_creation: true
  allow_list_all_teams: true
  platform_access:
    policy: restrictive
    allowed_user_emails: ["admin@example.com", "dev@example.com", "ops@example.com"]
registry:
  type: "oci-client-auth"
  # Internal URL the server's Docker daemon uses to PULL app images.
  registry_url: "rise-registry:5000"
  namespace: "rise-apps"
  # Public URL the CLI PUSHES to (behind Traefik basicauth). The CLI does its
  # own `docker login` here; oci-client-auth mints no credentials.
  client_registry_url: "registry.${RISE_DOMAIN}"
deployment_controller:
  type: "docker"
  traefik_network: "rise_default"
  traefik_entrypoint: "web"
  production_ingress_url_template: "{project_name}.${RISE_DOMAIN}"
  staging_ingress_url_template: "{deployment_group}--{project_name}.${RISE_DOMAIN}"
  environment_ingress_url_template: "{environment}--{project_name}.${RISE_DOMAIN}"
  ingress_schema: "https"
  # Literal 443 (env-interpolated ints are not supported; the URL scheme is https).
  ingress_port: 443
  # Tells the controller to stamp tls=true + tls.certresolver=le on app routers
  # (see render_traefik_labels in src/server/deployment/controller/docker/labels.rs).
  traefik_certresolver: "le"
  reconcile_interval_secs: 5
  controller_class_name: "default"
  # Internal URL Traefik uses to reach the Rise backend for the forwardAuth
  # subrequest (compose service name + port).
  auth_backend_url: "http://rise:3000"
  # Browser-facing base URL for the login redirect. With the /.rise->backend
  # Traefik router in place, forwardAuth builds a SAME-HOST signin redirect and
  # this value is only the degraded fallback when X-Forwarded-Host is absent
  # (see build_signin_redirect_url in src/server/auth/handlers.rs). Kept
  # consistent with public_url's host.
  auth_signin_url: "https://rise.${RISE_DOMAIN}"
  access_classes:
    public:
      display_name: Public
      description: Public — no auth.
      ingress_class: traefik
      access_requirement: None
    private:
      display_name: Private
      description: Requires project membership.
      ingress_class: traefik
      access_requirement: Member
deployment_logs:
  type: "docker"
