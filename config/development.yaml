#   namespace: "rise-apps"

# JFrog Artifactory registry (via Vault):
# registry:
#   type: "jfrog"
#   registry_host: "rise-jfrog:8082"
#   client_registry_url: "localhost:3082"
#   docker_repo_key: "rise-docker-local"
#   token_provider:
#     type: "vault"
#     vault_mount_path: "artifactory"
#     vault_role: "rise"
#   # push_permissions: "r,w"     # default
#   # pull_permissions: "r"       # default
#   # push_token_ttl: 600         # push token TTL in seconds (default: 600)
#   # pull_token_ttl: 86400       # pull token TTL in seconds (default: 86400 = 24h)

# JFrog Artifactory registry (via Direct token):
registry:
  type: "jfrog"
  registry_host: "rise-jfrog:8082"
  client_registry_url: "localhost:3082"
  docker_repo_key: "rise-docker-local"
  token_provider:
    type: "direct"
    jfrog_url: "http://localhost:3082"
    admin_token: "${JFROG_ADMIN_TOKEN}"

deployment_controller:
  type: "kubernetes"
  pod_security_enabled: false
  metacontroller_webhook_port: 3001
  # metacontroller_pod_namespace is intentionally absent in development:
  # Rise runs on the host (outside the cluster), so source-IP validation is skipped.
  production_ingress_url_template: "{project_name}.rise.local"
  staging_ingress_url_template: "{deployment_group}--{project_name}.preview.rise.local"
  environment_ingress_url_template: "{environment}--{project_name}.preview.rise.local"
  namespace_format: "rise-{project_name}"
  auth_backend_url: "http://host.minikube.internal:3000" # URL for Nginx auth subrequests (Docker bridge IP for Minikube to reach host), must be resolvable by Nginx pod
  auth_signin_url: "http://rise.local:3000" # Domain for user-facing OAuth redirects, must be resolvable by users' browsers
  ingress_annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  ingress_port: 8080 # `mise minikube:up` port-forwards ingress to this port
  ingress_schema: "http" # Use http for local development
  host_aliases:
    rise.local: "192.168.49.1" # Minikube host IP, allowing app pods to access Rise backend
  # Extra projected service account tokens mounted in every app pod at
  # /var/run/secrets/rise/tokens/<name>
  # extra_service_token_audiences:
  #   vault: "https://vault.example.com"
  network_policy:
    ingress:
      # Allow traffic from ingress-nginx
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
            podSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
      # Allow intra-namespace traffic
      - from:
          - podSelector:
              matchLabels: {}
    # null = no egress restrictions (all outbound traffic allowed)
    egress: null
  access_classes:
    public:
      display_name: "Public"
      description: "Fully public - no authentication required."
      ingress_class: "nginx"
      access_requirement: None
    authenticated:
      display_name: "Authenticated"
      description: "Requires authentication but not project membership."
      ingress_class: "nginx"
      access_requirement: Authenticated
    private:
      display_name: "Private"
      description: "Requires authentication and project membership."
      ingress_class: "nginx"
      access_requirement: Member
