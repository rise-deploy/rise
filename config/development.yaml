# yaml-language-server: $schema=../docs/user/public/schemas/backend-settings.schema.json
# Insecure development configuration - DO NOT USE IN PRODUCTION.

server:
  host: "0.0.0.0"
  port: 3000
  public_url: "http://rise.local:3000"
  frontend_dev_proxy_url: "http://localhost:5173"
  cookie_secure: false
  jwt_signing_secret: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" # Generate with: openssl rand -base64 32
  jwt_claims: ["sub", "email", "name"]
  static_dir: "${RISE_STATIC_DIR:-static}" # In-container: /var/lib/rise/static; local dev: static/
  docs_dir: "${RISE_DOCS_DIR:-docs/user/dist}" # In-container: /var/rise/docs; local dev: build with `mise docs:build`
  ssrf:
    allow_private_networks: true # Allow private IPs for local OIDC (Dex at localhost)
    allow_http: true # Allow HTTP for local development

database:
  url: "${DATABASE_URL}"

# Local AES-GCM is the lowest-friction encryption for new contributors.
# Swap to aws-kms (commented below) if you're mirroring rise-dev/rise-prod
# locally and have AWS+KMS creds available.
encryption:
  type: "aes-gcm-256"
  key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" # Generate with: openssl rand -base64 32

# encryption:
#   type: "aws-kms"
#   region: "${AWS_REGION:-us-east-1}"
#   key_id: "${KMS_KEY_ID}"

auth:
  issuer: "http://localhost:5556/dex"
  client_id: "rise-backend"
  client_secret: "rise-backend-secret"
  admin_users:
    - "admin@example.com"
  # Allow all users to create teams (default: true). Set to false to restrict team creation to admins only.
  allow_team_creation: true
  # Allow all users to list all teams (default: true). Set to false so non-admins only see their own teams.
  allow_list_all_teams: true
  platform_access:
    policy: restrictive
    allowed_user_emails:
      - "admin@example.com"
      - "dev@example.com"

# Local-only OCI registry (no AWS deps) — lowest-friction default for new
# contributors. Swap to the ECR block below if you're mirroring
# rise-dev/rise-prod locally and have AWS creds available.
registry:
  type: "oci-client-auth"
  registry_url: "rise-registry:5000"
  namespace: "rise-apps"
  client_registry_url: "rise-registry:5000"

# Mirrors rise-dev/rise-prod and lets you exercise the client-controlled
# JFrog push path (rise.workspace.toml with [registry] image_base) on top
# of the same backend wiring used in prod. `strict_external_hosts` extends
# the cross-project image validation to JFrog refs that source repos push to.
# registry:
#   type: "ecr"
#   region: "${AWS_REGION:-us-east-1}"
#   account_id: "${AWS_ACCOUNT_ID}"
#   repo_prefix: "${ECR_REPO_PREFIX:-rise/}"
#   role_arn: "${ECR_CONTROLLER_ROLE_ARN}"
#   push_role_arn: "${ECR_PUSH_ROLE_ARN}"
#   auto_remove: false
#   strict_external_hosts:
#     - "jfrog.helsing-dev.ai"

deployment_controller:
  type: "kubernetes"
  pod_security_enabled: false
  metacontroller_webhook_port: 3001
  # metacontroller_pod_namespace is intentionally absent in development:
  # Rise runs on the host (outside the cluster), so source-IP validation is skipped.
  production_ingress_url_template: "{project_name}.rise.local"
  staging_ingress_url_template: "{deployment_group}--{project_name}.preview.rise.local"
  environment_ingress_url_template: "{environment}--{project_name}.preview.rise.local"
  namespace_format: "rise-{project_name}"
  auth_backend_url: "${RISE_AUTH_BACKEND_URL:-http://host.minikube.internal:3000}" # URL for Nginx auth subrequests, must be reachable from ingress-nginx pods
  auth_signin_url: "http://rise.local:3000" # Domain for user-facing OAuth redirects, must be resolvable by users' browsers
  # Externally-managed pull secret reference attached to every app pod (in
  # addition to the controller-minted rise-registry-creds). Required when
  # mirroring the rise-dev/rise-prod JFrog wiring locally; harmless to
  # leave commented out for the default OCI-registry-only setup since
  # nothing would pull from JFrog anyway.
  # Locally, `mise run dev:jfrog-refresh` installs Emberstack Reflector +
  # a source secret that auto-mirrors to all rise-* namespaces (faking
  # what ESO's ClusterExternalSecret does in prod).
  # external_pull_secret_name: "jfrog-helsing-dev-ai-user"
  ingress_annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  ingress_port: 8080 # `mise minikube:up` port-forwards ingress to this port
  ingress_schema: "http" # Use http for local development
  host_aliases:
    rise.local: "${RISE_K8S_HOST_IP:-192.168.49.1}" # Host IP reachable from Kubernetes pods
  # Extra projected service account tokens mounted in every app pod at
  # /var/run/secrets/rise/tokens/<name>
  # extra_service_token_audiences:
  #   vault: "https://vault.example.com"
  network_policy:
    ingress:
      # Allow traffic from ingress-nginx
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
            podSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
      # Allow intra-namespace traffic
      - from:
          - podSelector:
              matchLabels: {}
    # null = no egress restrictions (all outbound traffic allowed)
    egress: null
  access_classes:
    public:
      display_name: "Public"
      description: "Fully public - no authentication required."
      ingress_class: "nginx"
      access_requirement: None
    authenticated:
      display_name: "Authenticated"
      description: "Requires authentication but not project membership."
      ingress_class: "nginx"
      access_requirement: Authenticated
    private:
      display_name: "Private"
      description: "Requires authentication and project membership."
      ingress_class: "nginx"
      access_requirement: Member
