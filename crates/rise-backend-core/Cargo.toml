[package]
name = "rise-backend-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rise-deploy/rise"
description = "Shared deployment-backend contracts for Rise (models, traits, URL/quantity helpers)"
publish = false

[features]
default = []
# Enables `schemars::JsonSchema` derives on the shared settings types so
# `rise-deploy` can include them in the generated backend-config schema.
schema = ["dep:schemars", "rise-deployment-spec/schema"]
# Exposes `test_helpers` to other crates' tests; enable it only from
# `[dev-dependencies]` so the fixtures never reach a production build.
test-helpers = []

[dependencies]
anyhow = { workspace = true }
async-stream = "0.3"
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
regex = "1.11"
# Traefik API client for the shared readiness signal (`serverStatus`). HTTP only —
# this crate still never touches a database.
reqwest = { version = "0.13.0", features = ["json"] }
rise-deployment-spec = { path = "../rise-deployment-spec" }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for `#[derive(sqlx::FromRow)]` / `#[derive(sqlx::Type)]` on the moved
# models. This crate never opens a connection or runs a query — the
# `DeploymentStore` implementation lives in `rise-deploy`.
sha2 = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = "2.1"
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
