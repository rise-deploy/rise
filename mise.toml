[tool_alias]
railpack = "github:railwayapp/railpack"
buildkit = "github:moby/buildkit"

[tools]
minikube = "1.38.1"
pack = "0.40.6"
railpack = "0.15.1"
buildkit = "0.28.0"
"cargo:sqlx-cli" = "latest"
"cargo:cargo-all-features" = "latest"
helm = "latest"
rust = { version = "1.95.0", profile = "default" }
kubectl = "latest"
k9s = "latest"
vault = "latest"

[tasks.setup]
description = "One-stop dev environment setup (hosts, docker, cluster). Cross-platform (Linux + macOS). Run interactively."
run = "./scripts/dev-setup.sh"

[tasks."check:hosts"]
description = "Verify /etc/hosts has the required rise-registry, rise-jfrog and rise.local entries."
run = """
ok=true
for h in rise-registry rise-jfrog rise.local; do
  if ! awk -v h="$h" '{for (i = 1; i <= NF; i++) if ($i == h) {found = 1; exit}} END {exit !found}' /etc/hosts; then
    echo "MISSING: /etc/hosts entry for '$h'"
    ok=false
  fi
done
if [ "$ok" = false ]; then
  echo ""
  echo "Run './scripts/dev-setup.sh hosts' to fix this."
  exit 1
fi
echo "OK: /etc/hosts is configured."
"""

[tasks."check:docker"]
description = "Verify Docker is running and has insecure-registries configured."
run = """
if ! docker info > /dev/null 2>&1; then
  echo "FAIL: Docker daemon is not running."
  echo "Start Docker (Docker Desktop on macOS) and try again."
  exit 1
fi
case "$(uname -s)" in
  Darwin) daemon_json="$HOME/.docker/daemon.json" ;;
  *)      daemon_json="/etc/docker/daemon.json" ;;
esac
if [ -f "$daemon_json" ] && ! grep -q 'rise-registry:5000' "$daemon_json"; then
  echo "MISSING: 'rise-registry:5000' not in $daemon_json insecure-registries."
  echo ""
  echo "Run './scripts/dev-setup.sh docker' to fix this."
  exit 1
fi
echo "OK: Docker is running and configured."
"""

[tasks."check:k8s"]
description = "Verify a Kubernetes cluster (minikube or k3s) is reachable."
run = """
if ! kubectl cluster-info > /dev/null 2>&1; then
  echo "FAIL: No Kubernetes cluster reachable via kubectl."
  echo ""
  echo "Run './scripts/dev-setup.sh minikube' (or 'k3s' on Linux) to set one up."
  exit 1
fi
echo "OK: Kubernetes cluster is reachable."
"""

[tasks.dev]
depends = ["check:hosts", "check:docker", "check:k8s"]
run = """
docker compose up -d
mise run db:migrate
mise run frontend:dev &
mise run backend:run
"""

[tasks."sqlx:prepare"]
description = "Prepare the SQLX query cache that needs to be committed for building with SQLX_OFFLINE=true."
run = "cargo sqlx prepare -- --package rise-deploy --features cli,backend --all-targets"

[tasks."sqlx:check"]
description = "Check that all SQLX queries are valid."
run = "cargo sqlx prepare --check -- --package rise-deploy --features cli,backend --all-targets"

[tasks."resource-store:sqlx:prepare"]
description = "Prepare the SQLX query cache for rise-resource-store (requires running DB)."
run = "cargo sqlx prepare -- --package rise-resource-store --all-targets"

[tasks."resource-store:sqlx:check"]
description = "Verify the SQLX query cache for rise-resource-store is up to date."
run = "cargo sqlx prepare --check -- --package rise-resource-store --all-targets"

[tasks.lint]
description = "Run all linting checks (clippy, formatting, sqlx, helm)."
run = """
cargo all-features check --all-targets
cargo check --package rise-resource-api --all-targets
cargo check --package rise-resource-store --all-targets
cargo all-features clippy --all-targets -- -D warnings
cargo clippy --package rise-resource-api --all-targets -- -D warnings
cargo clippy --package rise-resource-store --all-targets -- -D warnings
cargo fmt --all -- --check
mise sqlx:check
helm lint helm/rise
"""
env.SQLX_OFFLINE = true

[tasks."config:schema:generate"]
description = "Generate the backend settings JSON schema."
run = "cargo run --package rise-deploy --features cli,backend -- backend config-schema > docs/user/public/schemas/backend-settings.schema.json"
env.SQLX_OFFLINE = true

[tasks."config:schema:check"]
description = "Verify the committed backend settings JSON schema is up to date."
run = "mise config:schema:generate && git --no-pager diff --exit-code -- docs/user/public/schemas/backend-settings.schema.json"
env.SQLX_OFFLINE = true

[tasks."rise-toml:schema:generate"]
description = "Generate the rise.toml JSON schema."
run = "cargo run --package rise-deploy --features cli,backend -- backend rise-toml-schema > docs/user/public/schemas/rise-toml-v1.schema.json"
env.SQLX_OFFLINE = true

[tasks."rise-toml:schema:check"]
description = "Verify the committed rise.toml JSON schema is up to date."
run = "mise rise-toml:schema:generate && git --no-pager diff --exit-code -- docs/user/public/schemas/rise-toml-v1.schema.json"
env.SQLX_OFFLINE = true

[tasks."crd:generate"]
description = "Generate the RiseProject CRD YAML for the Helm chart."
run = "cargo run --package rise-deploy --features cli,backend -- backend crd-schema > helm/rise/crds/riseproject-crd.yaml"
env.SQLX_OFFLINE = true

[tasks."crd:check"]
description = "Verify the committed CRD YAML is up to date with the Rust definition."
run = "mise crd:generate && git --no-pager diff --exit-code -- helm/rise/crds/riseproject-crd.yaml"
env.SQLX_OFFLINE = true

[tasks."docs:install"]
description = "Install documentation dependencies (shared workspace)."
dir = "docs"
run = "npm install"

[tasks."docs:serve"]
description = "Serve bundled user documentation with live reload on port 3001."
depends = ["docs:install"]
dir = "docs/user"
run = "npm run dev"

[tasks."docs:build"]
description = "Build the bundled user documentation."
depends = ["docs:install"]
dir = "docs/user"
run = "npm run build"

[tasks."docs:engineering:serve"]
description = "Serve engineering documentation with live reload on port 3002."
depends = ["docs:install"]
dir = "docs/engineering"
run = "npm run dev"

[tasks."docs:engineering:build"]
description = "Build the engineering documentation."
depends = ["docs:install"]
dir = "docs/engineering"
run = "npm run build"

[tasks."db:nuke"]
description = "Drop and recreate the development database. USE WITH CAUTION."
run = """
set -x
docker compose down -v postgres
docker compose up postgres -d
"""

[tasks."db:migrate"]
description = "Run database migrations. Run before building the backend."
run = "docker compose up postgres -d && sleep 2 && sqlx migrate run"

[tasks."backend:deps"]
description = "Start all backend dependencies with docker compose."
run = "docker compose up -d"

[tasks."backend:run"]
description = "Run the backend server."
depends = ["backend:deps", "db:migrate"]
run = """
if [ -f .env ]; then
  . ./.env
fi
if [ -z "${RISE_AUTH_BACKEND_URL:-}" ]; then
  HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i <= NF; i++) if ($i == "src") {print $(i + 1); exit}}')
  export RISE_K8S_HOST_IP="${HOST_IP}"
  export RISE_AUTH_BACKEND_URL="http://${HOST_IP}:3000"
fi
cargo run --features cli,backend -- backend server
"""
alias = "br"
env.https_proxy = ""
env.HTTPS_PROXY = ""

[tasks."backend:run-container"]
description = "Build and run the backend server in its container (host network). Useful to validate the containerized version works as intended."
depends = ["backend:deps", "db:migrate"]
run = """
if [ -f .env ]; then
  . ./.env
fi
if [ -z "${RISE_AUTH_BACKEND_URL:-}" ]; then
  HOST_IP=$(ip -4 route get 1.1.1.1 | awk '{for (i = 1; i <= NF; i++) if ($i == "src") {print $(i + 1); exit}}')
  export RISE_K8S_HOST_IP="${HOST_IP}"
  export RISE_AUTH_BACKEND_URL="http://${HOST_IP}:3000"
fi
docker build . -t rise --target rise && docker run --rm --network host -v $PWD/config:/etc/rise:ro -v $HOME/.kube:/root/.kube:ro -v $HOME/.minikube:$HOME/.minikube:ro -e DATABASE_URL=$DATABASE_URL -e RISE_CONFIG_DIR=/etc/rise -e RISE_CONFIG_RUN_MODE=development -e RISE_AUTH_BACKEND_URL=$RISE_AUTH_BACKEND_URL -e RISE_K8S_HOST_IP=$RISE_K8S_HOST_IP rise backend server
"""

[tasks."frontend:dev"]
description = "Run the Vite frontend development server."
run = "cd frontend && npm install && npm run dev"

[tasks."frontend:build"]
description = "Build the frontend bundle for embedding in the backend binary."
run = """
cd frontend
npm install
npm run build
cp dist/index.html ../static/
cp -r dist/assets/* ../static/assets/
"""

[tasks."dist:build"]
description = "Build local release artifacts using cargo-dist."
run = """
cargo install cargo-dist --locked
cargo dist build --target x86_64-unknown-linux-gnu --target x86_64-apple-darwin --target aarch64-apple-darwin
"""

[tasks."minikube:up"]
description = "Start Minikube with local Docker registry access and ingress port-forwarding."
run = "./scripts/dev-setup.sh minikube"

[tasks."minikube:down"]
description = "Stop and delete Minikube."
run = "minikube delete"

[tasks."k3s:up"]
description = "Install and configure k3s (Linux only)."
run = "./scripts/dev-setup.sh k3s"

[tasks."k3s:down"]
description = "Uninstall k3s (Linux only)."
run = """
if [ "$(uname -s)" != "Linux" ]; then
  echo "k3s is Linux only."
  exit 1
fi
sudo /usr/local/bin/k3s-uninstall.sh
"""

[tasks."test:e2e-build"]
description = "Run end-to-end build backend tests (all or specific backends)."
run = "bash tests/e2e-build/run.sh"

[tasks."dev:oidc-issuer"]
run = """
( sleep 2 && curl http://localhost:9229/token -d '{"sub": "test", "aud": "http://rise.local:3000"}' ) &
npx @oidc.pub/cli dev issuer --url http://localhost:9229
"""
