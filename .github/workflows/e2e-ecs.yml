name: E2E / ECS

# Runs the cross-backend harness against the persistent Amazon ECS environment
# in the scratch account (see tests/e2e/bootstrap, applied once by hand).
#
# Not part of ci.yml: it needs AWS credentials, it takes appreciably longer than
# the other backends, and it drives a shared environment that only one run may
# hold at a time. Nightly on develop, or opt in on a pull request with the
# `ecs-e2e` label.

on:
  schedule:
    # 03:17 UTC — off the hour, so it does not contend with everything else
    # scheduled at :00.
    - cron: "17 3 * * *"
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to test (defaults to develop-<short-sha>)."
        required: false
        type: string

# One run at a time, across every trigger. The environment is shared and its
# resource names are fixed, so two runs would collide on the per-run Terraform
# state, fight over the same project names, and exceed the account's Fargate
# quota between them.
concurrency:
  group: e2e-ecs
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write # GitHub OIDC, so no long-lived AWS keys live in this repo.

jobs:
  ecs:
    name: E2E / ECS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A labelled PR only, and only one from this repository: a fork's head is
    # untrusted and this job holds credentials.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'ecs-e2e' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve the image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            tag="${{ inputs.image_tag }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            tag="develop-${short_sha}"
          fi
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Image under test: ${tag}"

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          experimental: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the e2e role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ vars.AWS_E2E_REGION }}
          role-session-name: rise-e2e-${{ github.run_id }}

      # Built here rather than pulled from ci.yml's artifact: this workflow runs
      # on its own schedule, with no upstream job to take one from.
      - name: Build the harness
        run: cargo build --manifest-path tests/e2e/Cargo.toml --release

      - name: Run the harness
        env:
          RISE_E2E_BACKEND: ecs
          RISE_E2E_ENV: ${{ vars.AWS_E2E_ENV_NAME || 'rise-e2e' }}
          AWS_REGION: ${{ vars.AWS_E2E_REGION }}
          RISE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          RISE_IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: ./tests/e2e/target/release/rise-e2e

      # The harness sweeps and destroys in tear_down, but a cancelled job never
      # gets there -- and what it would leave behind holds Fargate quota and an
      # open ingress rule. The next run's bring-up sweep is the real backstop;
      # this narrows the window.
      - name: Destroy the per-run stack
        if: always()
        env:
          AWS_REGION: ${{ vars.AWS_E2E_REGION }}
        run: |
          terraform -chdir=tests/e2e/run destroy -auto-approve -input=false || true
