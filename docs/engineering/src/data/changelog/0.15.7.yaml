version: 0.15.7
date: 2026-02-27
introduction: |-
  This archive records the OAuth credential migration. See the GitHub release for the complete release notes.
changes:
  - id: oauth-client-secret-ref-removed
    title: OAuth client_secret_ref requires migration to encrypted storage
    type: deprecation
    feature: oauth-client-secret-ref
    stage: removed
    impact: breaking
    availability: |-
      OAuth runtime flows require `client_secret_encrypted`; `client_secret_ref` is not a usable credential source. New and updated extension specs require the encrypted field. Existing stored specs containing only `client_secret_ref` are accepted for automatic migration by the OAuth reconciler while the referenced project environment variable remains available.
    details: |-
      The OAuth reconciler reads the referenced environment variable, encrypts its value into `client_secret_encrypted`, removes `client_secret_ref` from the stored spec, and attempts to delete the environment variable. Direct runtime lookup through `client_secret_ref` is removed. See [#155](https://github.com/rise-deploy/rise/pull/155).
    migration: |-
      1. For an existing stored extension with `client_secret_ref`, keep the referenced project environment variable available until the OAuth reconciler successfully migrates the spec. The reconciler attempts to delete that variable after migration; move any other consumers to their own secret first.
      2. Verify that the extension spec contains `client_secret_encrypted` and test its OAuth flow. If migration fails, inspect the backend's `Failed to migrate client_secret_ref` log and restore the referenced variable or configure the client secret through the extension editor.
      3. Use `client_secret_encrypted` for new configurations and automation. Do not submit a spec containing only `client_secret_ref`. See [OAuth configuration](/operator-docs/extensions/oauth/#configuration).
