version: 0.21.0
date: 2026-05-04
introduction: |-
  This release focuses on **security hardening**, **high-availability support**, and a **major architectural change** to the Kubernetes deployment controller.
groups:
  - id: new-features
    title: New Features
  - id: bug-fixes
    title: Bug Fixes
  - id: other-changes
    title: Other Changes
changes:
  - id: v0-21-0-001
    title: Metacontroller-based deployment controller
    group: new-features
    type: feature
    backends: [ kubernetes ]
    details: |-
      — Migrated the Kubernetes deployment controller from an in-process controller to a Metacontroller webhook architecture (`d65ecf7`, `c57ba8b`)
  - id: v0-21-0-002
    title: High-availability backend
    group: new-features
    type: feature
    details: |-
      — Backend is now safe to run with multiple replicas, including HA lease liveness and retryable OAuth state (`7077511`, `fe18842`)
  - id: v0-21-0-003
    title: Deployment secrets as Kubernetes Secrets
    group: new-features
    type: feature
    backends: [ kubernetes ]
    details: |-
      — Environment variable secrets are now injected as proper Kubernetes Secrets instead of inline values (`bd10719`)
  - id: v0-21-0-004
    title: Pod-IP validation for webhooks
    group: new-features
    type: feature
    backends: [ kubernetes ]
    details: |-
      — Replaced token-based webhook auth with pod-IP validation for improved security (`a48c586`)
  - id: v0-21-0-005
    title: "`--platform` build option"
    group: new-features
    type: feature
    details: |-
      — Override the default build platform (e.g., `--platform linux/amd64`) (`3626399`)
  - id: v0-21-0-006
    title: "`rise env export`"
    group: new-features
    type: feature
    details: |-
      — New command to export environment variables, with a fix to environment resolution in `rise run` (`08b6b67`)
  - id: v0-21-0-007
    title: Fix handling of terminating pods in deployment status display (`6c044ba`)
    group: bug-fixes
    type: fix
  - id: v0-21-0-008
    title: Reject plain PKCE method in OAuth flow, require S256 (`4b42ae3`)
    group: bug-fixes
    type: fix
  - id: v0-21-0-009
    title: Fix `podSelector` in webhook NetworkPolicy for metacontroller (`6909f0f`)
    group: bug-fixes
    type: fix
    backends: [ kubernetes ]
  - id: v0-21-0-010
    title: Added `cargo audit` to CI (`d3541cb`)
    group: other-changes
  - id: v0-21-0-011
    title: "Dependency updates: openssl, pack (buildpacks), marked"
    group: other-changes
  - id: v0-21-0-012
    title: Development documentation and task improvements
    group: other-changes
  - id: v0-21-0-013
    title: Updated tag-release script
    group: other-changes
