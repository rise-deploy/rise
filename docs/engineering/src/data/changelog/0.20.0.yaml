version: 0.20.0
date: 2026-04-27
introduction: |-
  This release introduces first-class environment support, source metadata tracking, and several security and reliability improvements.
changes:
  - id: v0-20-0-001
    title: First-class environments support
    details: |-
      — Environments are now a core concept, enabling separate deployment targets (e.g., staging, production) within a single project (#224)
  - id: v0-20-0-002
    title: Per-environment Kubernetes ServiceAccounts and labels
    backends: [ kubernetes ]
    details: |-
      — Each environment can have its own ServiceAccount and Kubernetes labels for better isolation and RBAC (#227)
  - id: v0-20-0-003
    title: Source metadata on projects and deployments
    details: |-
      — Projects and deployments now track source information (e.g., git repository, commit) for traceability (#229)
  - id: v0-20-0-004
    title: OAuth rate limiting
    details: |-
      — Token, authorize, and callback endpoints are now rate-limited to prevent abuse (#230)
  - id: v0-20-0-005
    title: Prevent team deletion when team owns projects
    details: |-
      — Teams can no longer be deleted if they still own projects, avoiding orphaned resources (#228)
  - id: v0-20-0-006
    title: Updated Rust dependencies (patch versions) (#217)
  - id: v0-20-0-007
    title: Updated npm dependencies (patch versions) (#220)
  - id: v0-20-0-008
    title: "Updated Python dependencies: `packaging` to v26.2 (#226), `click` to v8.3.3 (#222)"
  - id: v0-20-0-009
    title: Reverted premature version bump to 0.19.4
